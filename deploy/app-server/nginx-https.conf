server {
    listen 443 ssl;
    http2 on;
    server_name app.osirclaw.com;

    root /var/www/osir-codex-manager/current/site;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/app.osirclaw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.osirclaw.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /www/wwwlogs/app-osirclaw-https.access.log;
    error_log /www/wwwlogs/app-osirclaw-https.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /health {
        default_type application/json;
        return 200 '{"service":"osir-codex-manager","status":"ok"}';
    }

    location = /i18n-tunnel {
        proxy_pass http://127.0.0.1:3130;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location = /manager/latest.json {
        alias /var/www/osir-codex-manager/current/manager/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location /manager/ {
        alias /var/www/osir-codex-manager/current/manager/;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /latest/ {
        alias /var/www/osir-codex-manager/current/latest/;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /skins/ {
        alias /var/www/osir-codex-manager/current/skins/;
        add_header Cache-Control "public, max-age=300" always;
    }

    location ^~ /skins/dreamskin/ {
        proxy_pass http://127.0.0.1:3132;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
    }

    location /components/ {
        alias /var/www/osir-codex-manager/components/;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
