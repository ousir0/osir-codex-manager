<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title id="title">Codex Manager</title>
  <desc id="desc">A local manager for installing, updating, configuring and theming Codex through the OSIR mirror.</desc>

  <defs>
    <clipPath id="frame"><rect width="1400" height="420" rx="24"/></clipPath>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9EC7FF" stroke-opacity=".09"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1400" height="420" fill="#0E172A"/>
    <rect width="1400" height="420" fill="url(#grid)"/>
    <path d="M760 0H1400V420H820C910 326 910 103 760 0Z" fill="#162A49"/>
    <path d="M960 0H1400V420H1050C1114 296 1092 115 960 0Z" fill="#19365D" opacity=".58"/>

    <circle cx="1110" cy="116" r="86" fill="#69A5FA" opacity=".16" filter="url(#glow)"/>
    <circle cx="1218" cy="306" r="58" fill="#8DE1D0" opacity=".12" filter="url(#glow)"/>

    <!-- OSIR route mark: local app -> verified mirror -> API -->
    <g transform="translate(915 94)">
      <path d="M56 98H178M218 98H340" fill="none" stroke="#69A5FA" stroke-width="4" stroke-linecap="round"/>
      <path d="M168 89L180 98L168 107M330 89L342 98L330 107" fill="none" stroke="#69A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="198" cy="98" r="26" fill="#69A5FA" opacity=".18"/>
      <circle cx="198" cy="98" r="17" fill="#69A5FA"/>
      <path d="M190 98L196 104L207 91" fill="none" stroke="#0E172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="42" width="78" height="112" rx="12" fill="#15243D" stroke="#69A5FA" stroke-width="2"/>
      <rect x="14" y="58" width="50" height="8" rx="4" fill="#69A5FA" opacity=".85"/>
      <rect x="14" y="78" width="38" height="7" rx="3.5" fill="#DCEBFF" opacity=".7"/>
      <rect x="14" y="94" width="47" height="7" rx="3.5" fill="#DCEBFF" opacity=".28"/>
      <rect x="14" y="118" width="28" height="20" rx="6" fill="#8DE1D0" opacity=".9"/>
      <path d="M22 128L28 134L37 123" fill="none" stroke="#0E172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="316" y="42" width="78" height="112" rx="12" fill="#15243D" stroke="#8DE1D0" stroke-width="2"/>
      <circle cx="355" cy="78" r="16" fill="#8DE1D0" opacity=".9"/>
      <path d="M355 68V88M345 78H365" stroke="#0E172A" stroke-width="3" stroke-linecap="round"/>
      <rect x="330" y="108" width="50" height="7" rx="3.5" fill="#DCEBFF" opacity=".65"/>
      <rect x="339" y="124" width="32" height="7" rx="3.5" fill="#DCEBFF" opacity=".3"/>
    </g>

    <g transform="translate(96 76)">
      <rect width="574" height="268" rx="18" fill="#101D33" stroke="#69A5FA" stroke-opacity=".42" stroke-width="2"/>
      <rect width="574" height="42" rx="18" fill="#172A49"/>
      <rect y="24" width="574" height="18" fill="#172A49"/>
      <circle cx="24" cy="21" r="5" fill="#F4BF74"/>
      <circle cx="42" cy="21" r="5" fill="#8DE1D0"/>
      <circle cx="60" cy="21" r="5" fill="#69A5FA"/>

      <g transform="translate(34 74)">
        <path d="M36 24L48 47H73L92 80L73 113H48L36 136L24 113H0L-19 80L0 47H24Z" fill="#69A5FA" opacity=".16" stroke="#69A5FA" stroke-width="3" stroke-linejoin="round"/>
        <path d="M36 42L68 80L36 118L4 80Z" fill="none" stroke="#69A5FA" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="36" cy="80" r="10" fill="#8DE1D0"/>
        <path d="M31 80L35 84L43 75" fill="none" stroke="#0E172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(166 81)">
        <text x="0" y="24" font-size="31" font-weight="700" fill="#F2F7FF" letter-spacing=".2">OSIR</text>
        <text x="0" y="54" font-size="20" fill="#9EC7FF" letter-spacing=".4">Codex Manager</text>
        <text x="0" y="96" font-size="15" fill="#DCEBFF" opacity=".78">安装 · 更新 · 配置 · 主题</text>
        <text x="0" y="124" font-size="14" fill="#9EC7FF" opacity=".82">Verified bytes. Local control.</text>
      </g>

      <g transform="translate(166 205)">
        <rect width="114" height="28" rx="14" fill="#69A5FA" opacity=".15" stroke="#69A5FA" stroke-opacity=".62"/>
        <text x="57" y="19" text-anchor="middle" font-size="12" fill="#BFD9FF">Windows · macOS</text>
        <rect x="124" width="102" height="28" rx="14" fill="#8DE1D0" opacity=".13" stroke="#8DE1D0" stroke-opacity=".62"/>
        <text x="175" y="19" text-anchor="middle" font-size="12" fill="#BDEFE7">OSIR API</text>
        <rect x="236" width="112" height="28" rx="14" fill="#F4BF74" opacity=".12" stroke="#F4BF74" stroke-opacity=".62"/>
        <text x="292" y="19" text-anchor="middle" font-size="12" fill="#F8D59C">.codexskin</text>
      </g>
    </g>

    <text x="1310" y="382" text-anchor="end" font-size="13" fill="#9EC7FF" opacity=".72">app.osirclaw.com</text>
    <rect width="1400" height="420" rx="24" fill="none" stroke="#DCEBFF" stroke-opacity=".17"/>
