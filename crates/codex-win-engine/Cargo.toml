[package]
name = "codex-win-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure-logic engine for planning and staging Codex Windows MSIX updates."

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
