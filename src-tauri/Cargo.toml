[package]
name = "osir-codex-manager"
# The GUI app is the only [[bin]]. Dev/test harnesses live in examples/ (e.g.
# examples/win_real_smoke.rs) so cargo and tauri never build or bundle them into
# the .app — tauri's bundler copies every bin target, so a harness under src/bin/
# would otherwise ride along in the production app. default-run is kept
# defensively to pin `cargo run` to the app should another src/bin/* be added.
default-run = "osir-codex-manager"
version = "0.5.11"
description = "A personal cross-platform manager for installing, updating, configuring, and theming the official Codex desktop app."
authors = ["ousir0"]
edition = "2021"
license = "MIT"
repository = "https://github.com/ousir0/osir-codex-manager"

[lib]
name = "osir_codex_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
base64 = "0.23"
aes-gcm = "0.10"
codex-mac-engine = { path = "../crates/codex-mac-engine" }
codex-theme-engine = { path = "../crates/codex-theme-engine" }
codex-win-engine = { path = "../crates/codex-win-engine" }
directories = "6.0.0"
fs4 = "1.1"
flate2 = "1"
log = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "socks", "system-proxy"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tauri = { version = "2.11.2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "time"] }
tar = "0.4"
toml_edit = "0.25"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tauri-plugin-deep-link = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Keep these pinned to Tauri/Wry's WebView2 ABI: the platform handle returned
# by `WebviewWindow::with_webview` exposes these exact COM interfaces.
webview2-com = "=0.38.2"
windows-core = "0.61.2"
